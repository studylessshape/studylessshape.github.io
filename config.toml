baseURL = "https://study_less_shape.github.io/"
languageCode = "zh-cn" # deprecated on: v0.158.0, but not removed on v0.165.0.
locale = "zh-cn"
language = "zh-cn"
defaultContentLanguage = "zh"
title = "学少何Blog"
theme = ["hugo-notepadium", "hugo-notice"]
tag = "tags"
category = "categories"
copyright = "© 2026 学少何"

[markup.highlight]
codeFences = true
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[[params.nav.custom]]
title = "归类"
url = "/categories"

[[params.nav.custom]]
title = "标签"
url = "/tags"

[[params.nav.custom]]
title = "关于"
url = "/about"

[[params.nav.custom]]
title = "RSS"
url = "/index.xml"

[params.syntax]
use = "hljs"  # builtin: "prismjs", "hljs". "none" means Chroma
theme = "atom-one-light"
darkTheme = "tomorrow-night-eighties"

[params]
style = "auto"  # default: auto. light: light theme, dark: dark theme, auto: based on system.
dateFormat = "2006年1月2日 1:02"  # if unset, default is "2006-01-02"
logo = ""  # if you have a logo png
slogan = ""
license = ""  # CC License
fullRss = true

[params.profile]
enable = true
avatar = ""
name = "学少何"
bio = "_不求上进的社畜……_"  # support markdown syntax
twitter = ""  # https://twitter.com/XXX
github = "studylessshape"  # https://github.com/XXX
gitee = "study_less_shape" # https://gitee.com/XXX

# for chinese
[params.beian]
  icp = ""     # example: 粤ICP备20056596号-1
  # icp = "湘ICP备2024065160号-1"     # example: 粤ICP备20056596号-1
  gongan = ""  # example: 粤公网安备 44030502005645号
  code = ""    # example: 44030502005645

[params.comments]
enable = true  # En/Disable comments globally, default: false. You can always enable comments on per page.

[params.comments.utterances]
repo = "studylessshape/studylessshape.github.io" # enable comments with [utteranc.es](https://utteranc.es/)
theme = "github-dark"
label = "blog comment" # default: "💬 Comments"